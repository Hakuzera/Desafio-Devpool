<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Usuários</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="container">
        <h1>Cadastro de Usuários</h1>

        <section>
            <h2>Novo usuário</h2>

            <form id="formUsuario">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    required
                    minlength="3"
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite o e-mail"
                    required
                >

                <label for="login">Login</label>
                <input
                    type="text"
                    id="login"
                    placeholder="Digite o login"
                    required
                    minlength="3"
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Mínimo de 8 caracteres"
                    minlength="8"
                >

                <div class="campoAtivo">
                    <input type="checkbox" id="ativo" checked>
                    <label for="ativo">Usuário ativo</label>
                </div>

                <button type="button" id="btnCadastrar">
                    Cadastrar
                </button>
            </form>
        </section>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section>
            <h2>Usuários cadastrados</h2>
            <div id="listaUsuarios"></div>
        </section>
    </main>

    <script type="module" src="/script.js"></script>
</body>
</html>
